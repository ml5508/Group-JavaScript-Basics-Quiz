<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A beginner-friendly JavaScript basics quiz." />
    <title>JavaScript Basics Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="quiz-card">
      <p class="eyebrow">LEARN BY DOING</p>
      <h1>JavaScript Basics Quiz</h1>
      <p class="intro">Choose the best answer, then check your work.</p>

      <section class="question-box" aria-labelledby="question-text">
        <p class="question-count" id="question-count">Question 1 of 1</p>
        <h2 id="question-text"></h2>
        <div class="choices" id="choices" role="radiogroup" aria-label="Answer choices"></div>
      </section>

      <button class="check-button" id="check-button" type="button">Check answer</button>
      <p class="feedback" id="feedback" aria-live="polite"></p>

      <details class="team-note">
        <summary>For the team: where do we add questions?</summary>
        <p>Add another object to the <code>questions</code> array in <code>script.js</code>.</p>
      </details>
    </main>
    <script src="script.js"></script>
  </body>
</html>
